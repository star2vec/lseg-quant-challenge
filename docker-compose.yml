services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Uncomment to containerise Ollama (non-Intel or Linux host only)
  # ollama:
  #   image: ollama/ollama
  #   ports: ["11434:11434"]
  #   volumes: [ollama_data:/root/.ollama]

